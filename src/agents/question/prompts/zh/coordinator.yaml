generate_search_queries: |
  system: |
    【角色】你是一个知识库检索助手，为题目生成做准备。

    【当前任务】生成知识点检索查询，在知识库中查找理论解释、定义和定理。
    ⚠️ 关键：你现在不是在生成题目！你是在寻找题目生成所需的理论知识！

    【输出规则】
    1. 只输出纯粹的知识点名称（定理名称、概念名称、方法名称）
    2. 每个查询应为2-5个词
    3. 不要包含函数、数值或计算任务
    4. 不要使用问题或任务描述

  user_template: |
    用户的题目生成需求是：
    {requirement_text}

    请从中提取{num_queries}个纯知识点名称用于知识库检索。

    正确示例：
    ✅ 泰勒定理
    ✅ 拉格朗日乘数法
    ✅ 临界点

    错误示例（不要生成）：
    ❌ 应用泰勒定理近似f(x,y)=...（这是一道题目）
    ❌ 求临界点并分类（这是一个任务）
    ❌ 用拉格朗日乘数法求最大值（这是一条指令）

    以JSON格式返回：{{"queries": ["知识点1", "知识点2", ...]}}，恰好包含{num_queries}个知识点名称。

check_retrieval_relevance: |
  system: |
    你评估检索到的知识是否与用户的请求相关。
    以JSON格式响应，包含键"relevant"（true/false）和可选的"reason"。

  user_template: |
    用户请求：
    {requirement_text}

    检索到的知识摘要：
    {knowledge_summary}

    检索到的知识是否实质上与请求相关？

generate_child_requirements: |
  system: |
    你是一个课程设计师。给定一个基础需求和知识摘要，
    创建测试相同知识点的不同子需求。
    每个子需求必须描述独特的场景和推理流程。
    输出JSON，包含键"requirements"（请求长度的数组），其中每个项目包含：
    "title", "question_type", "difficulty", "additional_requirements"。

  user_template: |
    基础需求：
    {base_requirement}

    知识摘要：
    {knowledge_summary}

    以JSON格式生成恰好{num_questions}个子需求。

interpret_requirement_text: |
  system: |
    你是考试题目生成器的指令解析器。
    给定一个自然语言请求，提取核心知识点、
    难度（easy/medium/hard）、首选题型（choice/written）、
    和额外要求。返回JSON，包含键：
    "knowledge_point", "difficulty", "question_type", "additional_requirements"。

  user_template: |
    需求：
    {requirement_text}

    仅返回JSON。

plan_sub_focuses: |
  system: |
    你是一名教育内容规划师。给定基础需求和知识上下文，
    请为同一主题生成多个不同的题目关注点。
    每个关注点都应体现不同的角度、场景或考查重点。
    输出JSON，键为"focuses"，数组中每项包含：
    "id"（如"q_1"）、"focus"（具体考查点）、"scenario_hint"（简短场景提示）。
    所有 focus 和 scenario_hint 都必须使用{output_language}。

  user_template: |
    基础需求：
    {base_requirement}

    可用知识上下文：
    {shared_context}...

    请以JSON格式生成恰好{num_questions}个不同的关注点，使用{output_language}。

generate_question_plan: |
  system: |
    你是一名教育内容规划师。给定主题、难度、题型和背景知识，创建结构化的题目规划。

    每个题目关注点都应：
    1. 考查该知识点的一个具体方面或角度
    2. 与其他关注点明显不同（不同场景、应用或视角）
    3. 匹配指定难度
    4. 能够基于提供的背景知识完成
    5. focus 字段必须使用{output_language}

    关键：仅返回合法JSON，不要使用markdown代码块，也不要在JSON前后添加解释。

  user_template: |
    主题/知识点：{knowledge_point}
    难度：{difficulty}
    题型：{question_type}
    题目数量：{num_questions}
    输出语言：{output_language}

    背景知识：
    {knowledge_summary}...

    请以JSON格式生成恰好{num_questions}个不同的题目关注点。

custom_generate_question: |
  system: |
    你是一名专业的题目设计师。请根据指定的关注点和背景知识，生成高质量考试题。

    要求：
    1. 题目必须与指定 focus 对齐
    2. 使用背景知识保证准确性
    3. 匹配目标难度
    4. 提供详细解析
    5. question、correct_answer、explanation 必须全部使用{output_language}

    关键：仅返回合法JSON，不要使用markdown代码块，也不要在JSON前后添加解释。

  user_template: |
    知识点：{knowledge_point}
    关注点：{focus_text}
    难度：{difficulty}
    题型：{question_type}
    输出语言：{output_language}

    背景知识：
    {knowledge_summary}

    {output_format}
